name: Build macOS apps

# Builds "Shorts Factory" for Apple Silicon and Intel Macs and attaches the DMGs to a release.
# Run it from the Actions tab (enter the release tag, e.g. v1.0.0) or push a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the DMGs to
        required: true
        default: v1.0.0
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (M1 and later)
            arch: AppleSilicon
          - runner: macos-15-intel  # Intel Macs
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller
          .venv/bin/pip install mediapipe || echo "mediapipe unavailable on this architecture"
          .venv/bin/pip install faster-whisper || echo "faster-whisper unavailable on this architecture"
      - name: Build the app
        run: ./build_desktop.sh
      - name: Make the DMG
        run: |
          mkdir stage && cp -R "dist/Shorts Factory.app" stage/ && ln -s /Applications stage/Applications
          sudo mdutil -a -i off || true   # indexing keeps the volume busy on CI runners
          for i in 1 2 3 4 5 6; do
            hdiutil create -volname "Shorts Factory" -srcfolder stage -ov -format UDZO "Shorts-Factory-${{ matrix.arch }}.dmg" && break
            echo "hdiutil busy, retry $i"; sleep 10
          done
          test -f "Shorts-Factory-${{ matrix.arch }}.dmg"
          shasum -a 256 "Shorts-Factory-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Shorts-Factory-${{ matrix.arch }}
          path: Shorts-Factory-${{ matrix.arch }}.dmg
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "Shorts-Factory-${{ matrix.arch }}.dmg" --clobber --repo "${{ github.repository }}"
