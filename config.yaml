config_version: 3
channel:
  name: "VB AI Engineer"      # shown next to the logo in every video
  handle: "@VaibhavBansalCode"
  about: "VB: AI engineer explaining AI and software engineering in under 45 seconds. Practical, honest, a bit funny."
  logo: assets/logo.png          # replace with your own PNG (transparent background works best)

llm:
  model: claude-sonnet-5-5       # scripts are written by Claude; needs ANTHROPIC_API_KEY in .env

video:
  width: 1080
  height: 1920
  fps: 30
  min_seconds: 15
  max_seconds: 45
  max_seconds_remix: 50          # remix keeps the owner's clip pacing
  fonts:                         # first one that exists wins
    - /System/Library/Fonts/Supplemental/Arial Black.ttf
    - /System/Library/Fonts/Supplemental/Arial Bold.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  fonts_ko:                      # for Hangul text on screen (episode tags)
    - /System/Library/Fonts/AppleSDGothicNeo.ttc
    - /usr/share/fonts/truetype/noto/NotoSansCJK-Bold.ttc
  archive_cap_seconds: 15        # public-domain archive.org footage per video
  footage_cap_seconds: 12        # max seconds of third-party clips in any one video
  footage_cap_ratio: 0.35        # ...and never more than this share of the video
  music_dir: assets/music        # assets/music/<mood>/*.mp3  (moods: calm chill upbeat tense funny any)
  music_volume: 0.14             # music is ducked automatically while the voice speaks
  music:
    mode: auto                   # auto = pick by format mood | off
    fixed: null                  # e.g. assets/music/upbeat/my_track.mp3 to always use one track

voice:
  provider: edge                 # free Microsoft neural voices, no API key
  name: en-IN-PrabhatNeural      # Indian English; ElevenLabs Indian voices are used instead when a key is set
  rate: "+4%"

elevenlabs:                      # used automatically when ELEVENLABS_API_KEY is set (Setup page)
  voices: {male: "", female: ""}   # optional voice ids; blank = best Indian-accent English voices from the library

accents:                         # the voice picker in the app: English spoken with each accent (edge voices, free)
  indian:   {male: {name: en-IN-PrabhatNeural}, female: {name: en-IN-NeerjaNeural}}
  american: {male: {name: en-US-AndrewMultilingualNeural}, female: {name: en-US-AvaMultilingualNeural}}
  uk:       {male: {name: en-GB-RyanNeural}, female: {name: en-GB-SoniaNeural}}
  korean:   {male: {name: ko-KR-HyunsuMultilingualNeural}, female: {name: ko-KR-SunHiNeural}}  # Korean-accented English
eleven_accents: {indian: indian, american: american, uk: british, korean: korean}  # ElevenLabs library accent filter

voices:                          # extra voices: sigma narrator + the two K-drama characters
  sigma:     {name: en-IN-PrabhatNeural,  rate: "-6%", pitch: "-12Hz"}
  dub_male:  {name: en-IN-PrabhatNeural,  rate: "-2%", pitch: "-4Hz"}   # English dub (default for K-drama)
  dub_female: {name: en-IN-NeerjaNeural,  rate: "+2%", pitch: "+0Hz"}
  ko_male:   {name: ko-KR-InJoonNeural,   rate: "+0%", pitch: "-6Hz"}      # only if a script sets "language": "ko"
  ko_female: {name: ko-KR-SunHiNeural,    rate: "+4%", pitch: "+0Hz"}

youtube:
  privacy: private               # private | unlisted | public  (start private, review, then switch)
  category_id: "28"              # Science & Technology
  made_for_kids: false
  contains_synthetic_media: false  # set true if you want YouTube's "altered or synthetic" label
  default_hashtags: ["#Shorts", "#AI", "#SoftwareEngineering", "#Tech"]

# how many to make per `run`, and which formats (weight = relative chance)
formats:
  concept_explainer: 3
  ask_question: 2
  research_opinion: 3
  myth_vs_fact: 2
  analogy: 2
  interview_question: 2
  hot_take: 1
  quick_news: 2
  this_vs_that: 1
  meme_explainer: 3
  series_moment: 1   # needs clips in assets/library.yaml; falls back to memes
  sigma_reel: 2
  kdrama_parody: 2

selection:
  max_age_days: 14
  candidates_per_run: 30
  keywords: [llm, agent, rag, transformer, inference, gpu, kubernetes, distributed, microservice,
             architecture, scaling, latency, observability, reinforcement, diffusion, embedding,
             vector, fine-tuning, quantization, benchmark, reasoning, multimodal, mlops, platform,
             database, streaming, security, compiler, rust, python, open source, evaluation]
  exclude: [webinar, sponsored, hiring, job opening, press release]

sources:
  - {name: "Towards Data Science", kind: blog, weight: 1.0, url: "https://towardsdatascience.com/feed"}
  - {name: "Medium · AI",           kind: blog, weight: 0.8, url: "https://medium.com/feed/tag/artificial-intelligence"}
  - {name: "Medium · Software Eng", kind: blog, weight: 0.8, url: "https://medium.com/feed/tag/software-engineering"}
  - {name: "Medium · LLM",          kind: blog, weight: 0.8, url: "https://medium.com/feed/tag/llm"}
  - {name: "Netflix TechBlog",      kind: blog, weight: 1.4, url: "https://netflixtechblog.com/feed"}
  - {name: "Amazon Science",        kind: blog, weight: 1.3, url: "https://www.amazon.science/index.rss"}
  - {name: "AWS Machine Learning",  kind: blog, weight: 1.1, url: "https://aws.amazon.com/blogs/machine-learning/feed/"}
  - {name: "Microsoft Research",    kind: blog, weight: 1.3, url: "https://www.microsoft.com/en-us/research/feed/"}
  - {name: "Microsoft Dev Blogs",   kind: blog, weight: 1.0, url: "https://devblogs.microsoft.com/engineering-at-microsoft/feed/"}
  - {name: "Google Research",       kind: blog, weight: 1.2, url: "https://research.google/blog/rss/"}
  - {name: "arXiv cs.AI/LG/SE",     kind: paper, weight: 1.2,
     url: "https://export.arxiv.org/api/query?search_query=cat:cs.AI+OR+cat:cs.LG+OR+cat:cs.SE&sortBy=submittedDate&sortOrder=descending&max_results=40"}
